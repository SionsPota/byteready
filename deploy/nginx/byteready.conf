# byteready 反代配置
#
# 用法（服务器侧 root）：
#   ln -sf /root/byteready/deploy/nginx/byteready.conf /etc/nginx/conf.d/byteready.conf
#   nginx -t && systemctl reload nginx
#
# 拓扑：
#   443/80 (Nginx)
#     ├── /                → /root/byteready/apps/web/dist (SPA)
#     ├── /api/voice/asr   → 127.0.0.1:8000 (WebSocket upgrade)
#     └── /api/*           → 127.0.0.1:8000 (HTTP)
#
# 部署路径在多处硬编码 (/root/byteready)，迁移路径时一起改。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 上传体（简历 PDF / docx）放宽
    client_max_body_size 20m;

    # 前端 SPA 静态文件
    root /root/byteready/apps/web/dist;
    index index.html;

    # WebSocket：ASR 长连接，必须比 /api/ 更具体优先匹配
    location /api/voice/asr {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # 其它 HTTP API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;
}
